<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Courses - Course Registration System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div>
                <div class="brand">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span>UniPortal</span>
                </div>
                <ul class="nav-links">
                    <li><a href="courses.html" class="nav-link active"><i class="fa-solid fa-book-open"></i> Courses</a></li>
                    <li><a href="#" class="nav-link"><i class="fa-solid fa-calendar-days"></i> Schedule</a></li>
                    <li><a href="#" class="nav-link"><i class="fa-solid fa-user"></i> Profile</a></li>
                </ul>
            </div>
            <a href="../../backend/api/logout.php" class="nav-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="course-search-input" placeholder="Search available courses...">
                </div>
                <div class="user-profile">
                    <div class="avatar" id="user-avatar">--</div>
                    <span id="user-name-display">Loading...</span>
                </div>
            </header>

            <div class="tab-bar">
                <a href="courses.html" class="tab-link active">Available Courses</a>
                <a href="registered.html" class="tab-link">Registered Courses (<span id="reg-badge">0</span>)</a>
            </div>

            <section class="course-grid" id="available-courses-grid">
                <!-- Courses dynamically rendered by JS -->
            </section>
        </main>
    </div>

    <!-- Course Details Modal -->
    <div id="details-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Course Name</h3>
                <i class="fa-solid fa-xmark" style="cursor:pointer;" id="close-modal-x"></i>
            </div>
            <div style="font-size: 14px; line-height: 1.6;">
                <p><strong>Code:</strong> <span id="modal-code"></span></p>
                <p><strong>Credit Hours:</strong> <span id="modal-credits"></span></p>
                <p><strong>Instructor:</strong> <span id="modal-instructor"></span></p>
                <p><strong>Classroom:</strong> <span id="modal-room"></span></p>
                <br>
                <p><strong>Description:</strong></p>
                <p id="modal-description" style="color: var(--text-muted, #666);"></p>
            </div>
            <div class="modal-footer" style="margin-top: 20px; text-align: right;">
                <button class="btn btn-outline" id="close-modal-btn">Close</button>
            </div>
        </div>
    </div>

    <script src="../js/courses.js"></script>
</body>
</html>
