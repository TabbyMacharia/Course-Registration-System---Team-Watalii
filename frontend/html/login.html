<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UniPortal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fa-solid fa-graduation-cap"></i>
                <div class="brand" style="justify-content: center; margin-bottom: 8px;">
                    <span>UniPortal</span>
                </div>
                <h2>Student Portal</h2>
                <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Sign in to manage course registration</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">USERNAME OR EMAIL</label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            required 
                            placeholder="Enter username or email"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required 
                            placeholder="Enter password"
                        >
                        <i class="fa-solid fa-eye password-toggle" id="toggle-password"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">LOG IN</button>
            </form>

            <div style="margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-muted);">
                <span>Don't have an account? </span>
                <a href="signup.html" style="color: var(--gold-primary); font-weight: 700; text-decoration: none;">Sign Up</a>
            </div>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
