<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Course Registration System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <main class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fa-solid fa-graduation-cap"></i>
                <h2>Student Portal</h2>
                <p style="color: var(--text-muted, #666); font-size: 14px; margin-top: 4px;">Sign in to manage course registration</p>
            </div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" placeholder="e.g., ruth_ndua or ruth@dkut.ac.ke" required autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper" style="position: relative;">
                        <input type="password" id="password" value="password123" required autocomplete="current-password">
                        <i class="fa-solid fa-eye password-toggle" id="toggle-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer;"></i>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Sign In</button>
            </form>
        </div>
    </main>

    <script src="../js/login.js"></script>
</body>
</html>
