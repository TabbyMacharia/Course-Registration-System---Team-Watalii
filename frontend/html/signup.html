<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - UniPortal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card" style="max-width: 480px;">
            <div class="login-header">
                <i class="fa-solid fa-user-plus"></i>
                <div class="brand" style="justify-content: center; margin-bottom: 8px;">
                    <span>UniPortal</span>
                </div>
                <h2>Create Account</h2>
                <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Select your role and enter your details</p>
            </div>

            <form id="signup-form">
                <div class="form-group">
                    <label for="role">REGISTER AS</label>
                    <div class="input-wrapper">
                        <select id="role" name="role" required style="width: 100%; padding: 12px 16px; border: 1px solid var(--border-light); border-radius: var(--radius-pill); font-size: 13.5px; background-color: var(--surface-input); color: var(--text-primary); outline: none;">
                            <option value="student">Student</option>
                            <option value="lecturer">Lecturer</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="first_name">FIRST NAME</label>
                        <div class="input-wrapper">
                            <input type="text" id="first_name" name="first_name" required placeholder="Ruth">
                        </div>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="last_name">LAST NAME</label>
                        <div class="input-wrapper">
                            <input type="text" id="last_name" name="last_name" required placeholder="Ndua">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="identifier">REG / STAFF NUMBER</label>
                    <div class="input-wrapper">
                        <input type="text" id="identifier" name="identifier" required placeholder="e.g. C026-01-0764/2024 or LEC-001">
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">USERNAME</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" required placeholder="ruth_ndua">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">INSTITUTIONAL EMAIL</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" required placeholder="ruth@dkut.ac.ke">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">PASSWORD</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" required placeholder="Enter password">
                        <i class="fa-solid fa-eye password-toggle" id="toggle-password"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">REGISTER ACCOUNT</button>
            </form>

            <div style="margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-muted);">
                <span>Already have an account? </span>
                <a href="login.html" style="color: var(--gold-primary); font-weight: 700; text-decoration: none;">Sign In</a>
            </div>
        </div>
    </div>

    <script src="../js/signup.js"></script>
</body>
</html>
