<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Portal - Course Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div>
                <div class="brand">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span>UniPortal</span>
                </div>
                <ul class="nav-links">
                    <li>
                        <a href="lecturer.html" class="nav-link active">
                            <i class="fa-solid fa-book-medical"></i>
                            <span>PUBLISH COURSE</span>
                        </a>
                    </li>
                </ul>
            </div>
            <div>
                <a href="../../backend/api/logout.php" class="nav-link" style="color: var(--danger);">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>LOGOUT</span>
                </a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <h2>Lecturer Management Portal</h2>
                <div class="user-profile">
                    <div class="avatar">L</div>
                    <span>Lecturer Account</span>
                </div>
            </header>

            <section>
                <div style="margin-bottom: 24px;">
                    <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 6px;">Publish New Course Offering</h3>
                    <p style="color: var(--text-muted); font-size: 13px;">Add an available unit to the catalog for student registration</p>
                </div>

                <div class="table-container" style="max-width: 600px; padding: 32px;">
                    <form id="add-course-form">
                        <div class="form-group">
                            <label for="course_code">COURSE CODE</label>
                            <div class="input-wrapper">
                                <input type="text" id="course_code" name="course_code" required placeholder="e.g. CCS101">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="course_name">COURSE NAME</label>
                            <div class="input-wrapper">
                                <input type="text" id="course_name" name="course_name" required placeholder="e.g. Software Engineering">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="class_room">CLASSROOM / LECTURE HALL</label>
                            <div class="input-wrapper">
                                <input type="text" id="class_room" name="class_room" required placeholder="e.g. Lab 3B or LH 02">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="description">COURSE DESCRIPTION</label>
                            <div class="input-wrapper">
                                <textarea id="description" name="description" rows="4" placeholder="Overview of unit content..." style="width: 100%; padding: 12px 16px; border: 1px solid var(--border-light); border-radius: var(--radius-card); font-size: 13.5px; background-color: var(--surface-input); color: var(--text-primary); outline: none; resize: vertical;"></textarea>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary" style="padding: 12px 24px; margin-top: 10px;">PUBLISH COURSE</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/lecturer.js"></script>
</body>
</html>
